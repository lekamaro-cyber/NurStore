<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paiement annulé — Nur</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23f4b942'/></svg>" />
  <style>
    .status { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    .status-card { max-width: 480px; }
    .status-mark { width: 84px; height: 84px; border-radius: 50%; background: #e3d5b6; color: var(--muted); display: flex; align-items: center; justify-content: center; font-size: 2.2rem; margin: 0 auto 24px; }
  </style>
</head>
<body>
  <div class="status">
    <div class="status-card">
      <div class="status-mark">↩</div>
      <h1>Paiement annulé</h1>
      <p class="lead" style="margin: 18px auto 30px;">Aucun montant n'a été débité. Votre panier est toujours là si vous souhaitez réessayer.</p>
      <a href="/" class="btn btn-primary">Retour à la boutique</a>
    </div>
  </div>
</body>
</html>
