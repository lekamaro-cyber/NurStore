<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" fill="none" stroke="currentColor" role="img" aria-label="NUR">
  <!-- Logo NUR : point de lumière au-dessus du U, livre ouvert en dessous -->
  <!-- Anneau (la lumière / nour) -->
  <circle cx="220" cy="54" r="25" stroke-width="14" />
  <!-- N (trois segments pour des fûts bien droits) -->
  <path d="M70 102 V232 M70 102 L170 232 M170 102 V232" stroke-width="18" />
  <!-- U -->
  <path d="M196 102 V184 A34 34 0 0 0 264 184 V102" stroke-width="18" />
  <!-- R -->
  <path d="M296 232 V102 H330 A31 31 0 0 1 330 166 H296 M322 166 L368 232" stroke-width="18" />
  <!-- Livre ouvert -->
  <g stroke-width="13" stroke-linecap="round">
    <path d="M36 288 C 104 266, 170 278, 220 304" />
    <path d="M404 288 C 336 266, 270 278, 220 304" />
    <path d="M58 310 C 120 292, 178 298, 220 326" />
    <path d="M382 310 C 320 292, 262 298, 220 326" />
  </g>
</svg>
